[project]
name = "azure-tagday-ui"
dynamic = ["version"]
description = "Multi-Repository Azure DevOps & TFS Release Management, Workload Planning, and Tag Day Automation Platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "keckx" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Office/Business :: Groupware",
]
dependencies = [
    "jinja2>=3.1.2",
    "pyside6>=6.5.0",
    "python-docx>=1.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[tool.setuptools_scm]
write_to = "src/_version_scm.py"
fallback_version = "0.1.2637"

[project.scripts]
azure-tagday-ui = "gui.main:main"
tagday-gui = "gui.main:main"
gui = "gui.main:main"
tagday = "devops_helper:main_cli"
devops-helper = "devops_helper:main_cli"

[build-system]
requires = ["setuptools>=64.0", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "version",
    "_version_scm",
    "devops_helper",
    "utils",
    "generate_artifacts_report",
    "generate_rescheduling_report",
    "generate_revision",
    "generate_sprint_report",
    "generate_tagday_report",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["azure*", "gui*", "config*", "templates*"]

[tool.setuptools.package-data]
"gui" = ["qml/*.qml", "qml/**/*.qml"]
"config" = ["*.yaml", "*.yml", "*.json"]
"templates" = ["*.tmpl"]
"*" = ["*.qml", "*.yaml", "*.yml", "*.tmpl"]

[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
    "pytest>=7.0.0",
    "build>=1.0.0",
    "wheel>=0.40.0",
    "twine>=5.0.0",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "src",
]


