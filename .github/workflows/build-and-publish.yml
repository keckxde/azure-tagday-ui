name: Build & Publish Artifacts

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub Release & PyPI (if tagged or forced)'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Automated Unit Tests
  # ============================================================================
  test:
    name: Run Unit Tests
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies & Run Tests
        run: |
          uv sync
          uv run pytest

  # ============================================================================
  # 2. Build Python Packages (Wheel & sdist)
  # ============================================================================
  build-python-package:
    name: Build Python Wheel & Sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Distribution Packages
        run: |
          uv build

      - name: Verify Package Metadata
        run: |
          uv pip install --system twine
          twine check dist/*

      - name: Upload Python Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  # ============================================================================
  # 3. Build Windows Executable & NSIS Setup Installer
  # ============================================================================
  build-windows-installer:
    name: Build Windows Standalone Bundle & Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NSIS Compiler
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Sync Dependencies & Build Installer
        run: |
          uv sync
          uv run python build_installer.py

      - name: Upload Windows Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/AzureTagDayUI-Setup-*.exe
            dist/azure-tagday-ui-windows-x64*.zip
          if-no-files-found: error
          retention-days: 30

  # ============================================================================
  # 4. Release & Publish Artifacts
  # ============================================================================
  release:
    name: Publish GitHub Release & PyPI
    needs: [test, build-python-package, build-windows-installer]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Python Packages
        uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: dist-release/

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist-release/

      - name: List Release Files
        run: |
          ls -la dist-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/AzureTagDayUI-Setup-*.exe
            dist-release/azure-tagday-ui-windows-x64*.zip
            dist-release/*.whl
            dist-release/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI (if PYPI_API_TOKEN is set)
        if: ${{ secrets.PYPI_API_TOKEN != '' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install twine
          twine upload --skip-existing dist-release/*.whl dist-release/*.tar.gz
