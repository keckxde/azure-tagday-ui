# ==============================================================================
# GitLab CI/CD Pipeline for Azure TagDay & DevOps UI
# ==============================================================================

stages:
  # - test  # Disabled for now
  - build
  - release

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

default:
  interruptible: true

# --- Global Cache Configuration ---
cache:
  key:
    files:
      - uv.lock
      - pyproject.toml
  paths:
    - .uv-cache/
    - .venv/

